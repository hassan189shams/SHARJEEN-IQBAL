<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#214a38" />
    <title>Sharjeel Iqbal — AMUSU President 2026–27</title>
    <style>
      :root {
        --paper: #f5f0e5;
        --green: #214a38;
        --gold: #b79b62;
        --ink: #1e251f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--paper);
        color: var(--ink);
        line-height: 1.6;
      }
      .wrap {
        width: min(1100px, calc(100% - 32px));
        margin: 0 auto;
      }
      header {
        background: rgba(245, 240, 229, 0.96);
        border-bottom: 1px solid rgba(32, 38, 31, 0.12);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 74px;
      }
      .brand {
        color: var(--green);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
      }
      .hero {
        padding: 56px 0 32px;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        align-items: center;
        gap: 34px;
      }
      .eyebrow {
        color: var(--gold);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 16px;
        font-size: clamp(2.5rem, 5vw, 5rem);
        line-height: 0.96;
      }
      h1 span { color: var(--green); }
      .lead {
        font-size: 1.12rem;
        max-width: 35rem;
      }
      .hero-photo {
        position: relative;
      }
      .hero-photo img {
        display: block;
        width: 100%;
        border-radius: 22px;
        border: 1px solid rgba(32, 38, 31, 0.12);
        box-shadow: 0 18px 40px rgba(27, 41, 34, 0.18);
      }
      .photo-label {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(21, 35, 29, 0.7);
        color: #fff;
        backdrop-filter: blur(4px);
      }
      .photo-label small { display: block; opacity: .8; }
      .photo-label strong { display: block; font-size: 1.08rem; }
      .photo-label span {
        text-align: right;
        font-size: 0.76rem;
        line-height: 1.2;
        letter-spacing: 0.08em;
        font-weight: 800;
      }
      .editorial-art {
        padding: 8px 0 28px;
      }
      .editorial-art img {
        display: block;
        width: 100%;
        max-height: 420px;
        object-fit: cover;
        border-radius: 16px;
        border: 1px solid rgba(32, 38, 31, 0.12);
      }
      .gallery {
        padding: 16px 0 60px;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
      }
      .gallery-grid img {
        display: block;
        width: 100%;
        height: 270px;
        object-fit: cover;
        border-radius: 14px;
        border: 1px solid rgba(32, 38, 31, 0.12);
      }
      @media (max-width: 700px) {
        .hero-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap nav">
        <a class="brand" href="#home">Sharjeel Iqbal</a>
        <div class="brand">AMUSU President 2026–27</div>
      </div>
    </header>

    <main>
      <section class="hero" id="home">
        <div class="wrap hero-grid">
          <div>
            <div class="eyebrow">Aligarh Muslim University · AMUSU 2026–27</div>
            <h1>Leadership<br><span>with purpose.</span></h1>
            <p class="lead">A student-first vision built on listening, representation and responsible follow-through.</p>
          </div>

          <div class="hero-photo">
            <img src="./sharjeel-primary.jpg" alt="Sharjeel Iqbal, primary campaign portrait in a light sherwani" />
            <div class="photo-label">
              <div>
                <small>Candidate for</small>
                <strong>Sharjeel Iqbal</strong>
              </div>
              <span>AMUSU<br>PRESIDENT</span>
            </div>
          </div>
        </div>
      </section>

      <section class="editorial-art" aria-label="AMU-inspired campus illustration">
        <div class="wrap">
          <img src="./amu-editorial-illustration.svg" alt="Original editorial illustration of an academic building with arches, trees and a sunrise" />
        </div>
      </section>

      <section class="gallery">
        <div class="wrap">
          <div class="gallery-grid">
            <img src="./sharjeel-student-interaction.webp" alt="Sharjeel Iqbal greeting students on campus" />
            <img src="./sharjeel-campus-arches.webp" alt="Sharjeel Iqbal standing under red-brick arches" />
            <img src="./sharjeel-amu-building.webp" alt="Sharjeel Iqbal in front of an AMU building" />
            <img src="./sharjeel-campus-gate.webp" alt="Sharjeel Iqbal at the campus gate" />
            <img src="./sharjeel-campaign-poster.webp" alt="Campaign poster image of Sharjeel Iqbal" />
            <img src="./sharjeel-primary.jpg" alt="Sharjeel Iqbal portrait" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
